releaseNotes: "## Python SDK Changes:\n* `moov.accounts.connect()`: \n  *  `request.allow_scopes[]` **Changed** (Breaking ⚠️)\n* `moov.onboarding.get_invite()`:  `response.scopes[]` **Changed** (Breaking ⚠️)\n* `moov.onboarding.list_invites()`:  `response.[].scopes[]` **Changed** (Breaking ⚠️)\n* `moov.onboarding.create_invite()`: \n  *  `request.scopes[]` **Changed** (Breaking ⚠️)\n  *  `response.scopes[]` **Changed** (Breaking ⚠️)\n* `moov.transfers.list_cancellations()`:  `error.status[404]` **Added**\n* `moov.card_issuing.request()`:  `response.state.enum(frozen)` **Added**\n* `moov.fee_plans.list_partner_pricing_agreements()`:  `response.[]` **Changed**\n* `moov.statements.list()`:  `response.[]` **Changed**\n* `moov.statements.get()`:  `response` **Changed**\n* `moov.transfers.create_cancellation()`:  `error` **Changed**\n* `moov.fee_plans.list_fee_plan_agreements()`:  `response.[]` **Changed**\n* `moov.transfers.list_refunds()`:  `error.status[404]` **Added**\n* `moov.issuing_transactions.list()`:  `request.merchant_name` **Added**\n* `moov.fee_plans.create_fee_plan_agreements()`: \n  *  `request.prior_agreement_id` **Added**\n  *  `response` **Changed**\n* `moov.card_issuing.list()`: \n  *  `request.states` **Changed**\n  *  `response.[].state.enum(frozen)` **Added**\n* `moov.card_issuing.get()`:  `response.state.enum(frozen)` **Added**\n* `moov.card_issuing.update()`: \n  *  `request.state` **Changed**\n  *  `response.state.enum(frozen)` **Added**\n* `moov.card_issuing.get_full()`:  `response.state.enum(frozen)` **Added**\n* `moov.capabilities.get()`:  `response.requirements.currently_due[]` **Changed**\n* `moov.capabilities.request()`:  `response.[].requirements.currently_due[]` **Changed**\n* `moov.capabilities.list()`:  `response.[].requirements.currently_due[]` **Changed**\n"
